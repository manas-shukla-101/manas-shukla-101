<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,sans-serif">
    <defs>
        <!-- Background Gradients -->
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#090d16" />
            <stop offset="50%" stop-color="#060912" />
            <stop offset="100%" stop-color="#040711" />
        </linearGradient>
        
        <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f5d4" />
            <stop offset="50%" stop-color="#00bbf9" />
            <stop offset="100%" stop-color="#7b2cbf" />
        </linearGradient>

        <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f5d4" />
            <stop offset="50%" stop-color="#00bbf9" />
            <stop offset="100%" stop-color="#a066ff" />
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- Animations -->
        <style>
            .pulse { animation: pulse_anim 4s infinite alternate; }
            @keyframes pulse_anim {
                0% { opacity: 0.2; }
                100% { opacity: 0.8; }
            }
            .dash { 
                stroke-dasharray: 8 8; 
                animation: dash_anim 30s linear infinite; 
            }
            @keyframes dash_anim {
                to { stroke-dashoffset: -1000; }
            }
            .blink { animation: blink_anim 2s steps(2, start) infinite; }
            @keyframes blink_anim {
                0% { opacity: 1; }
                50% { opacity: 0; }
                100% { opacity: 1; }
            }
        </style>
    </defs>

    <!-- Outer Border with Glowing effect -->
    <rect x="2" y="2" width="876" height="256" rx="16" fill="url(#border-grad)" opacity="0.3" filter="url(#glow)"/>
    <rect x="4" y="4" width="872" height="252" rx="14" fill="url(#bg-grad)" stroke="#1a202c" stroke-width="2"/>

    <!-- Ambient Grid & Neural Connections -->
    <g stroke="#1a2436" stroke-width="1.5" opacity="0.6">
        <line x1="0" y1="50" x2="880" y2="50" />
        <line x1="0" y1="100" x2="880" y2="100" />
        <line x1="0" y1="150" x2="880" y2="150" />
        <line x1="0" y1="200" x2="880" y2="200" />
        <line x1="200" y1="0" x2="200" y2="260" />
        <line x1="400" y1="0" x2="400" y2="260" />
        <line x1="600" y1="0" x2="600" y2="260" />
    </g>

    <!-- Animated Synaptic Lines -->
    <g fill="none" stroke="url(#border-grad)" stroke-width="2" class="dash" opacity="0.4">
        <path d="M-50,20 Q150,80 300,140 T880,180" />
        <path d="M880,60 Q650,40 500,100 T-50,240" />
        <path d="M-50,150 Q150,150 400,20 T880,10" />
    </g>

    <!-- Glowing Nodes -->
    <g class="pulse">
        <circle cx="300" cy="140" r="4" fill="#00f5d4" filter="url(#glow)"/>
        <circle cx="500" cy="100" r="4" fill="#00bbf9" filter="url(#glow)"/>
        <circle cx="400" cy="20" r="4" fill="#7b2cbf" filter="url(#glow)"/>
        <circle cx="700" cy="170" r="4" fill="#00f5d4" filter="url(#glow)"/>
        <circle cx="150" cy="80" r="4" fill="#a066ff" filter="url(#glow)"/>
    </g>

    <!-- Typography -->
    <g transform="translate(60, 95)">
        <text x="0" y="0" font-size="52" font-weight="900" fill="url(#text-grad)" letter-spacing="4">MANAS SHUKLA</text>
        <text x="4" y="32" font-size="20" font-weight="600" fill="#c9d1d9" letter-spacing="1.5">AI &amp; AGENTIC SYSTEMS ARCHITECT</text>
        <text x="4" y="58" font-size="14" fill="#8b949e">Building autonomous multi-agent pipelines &amp; multimodal computer vision systems.</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(64, 185)">
        <!-- Badge 1 -->
        <rect x="0" y="0" width="165" height="30" rx="4" fill="#0d1117" stroke="#00f5d4" stroke-width="1.5"/>
        <text x="15" y="20" font-size="12" font-weight="600" fill="#00f5d4">🧠 Agentic Workflows</text>
        
        <!-- Badge 2 -->
        <rect x="180" y="0" width="160" height="30" rx="4" fill="#0d1117" stroke="#00bbf9" stroke-width="1.5"/>
        <text x="195" y="20" font-size="12" font-weight="600" fill="#00bbf9">👁️ Multimodal Vision</text>
        
        <!-- Badge 3 -->
        <rect x="355" y="0" width="145" height="30" rx="4" fill="#0d1117" stroke="#a066ff" stroke-width="1.5"/>
        <text x="370" y="20" font-size="12" font-weight="600" fill="#a066ff">⚡ Production ML</text>
    </g>

    <!-- Status Indicator (Top Right) -->
    <g transform="translate(620, 40)">
        <rect x="0" y="0" width="220" height="32" rx="16" fill="#161b22" stroke="#30363d"/>
        <circle cx="16" cy="16" r="5" fill="#00f5d4" filter="url(#glow)" class="blink"/>
        <text x="32" y="21" font-size="11" font-weight="bold" fill="#00f5d4" letter-spacing="0.5">SYSTEMS OPERATIONAL</text>
    </g>
</svg>
